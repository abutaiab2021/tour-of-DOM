<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Name</title>
</head>
<body>
    <main>
        <h2>Document By Tag Name</h2>
        <p>Global Insrance PLC</p>
        <p>Global Insrance PLC</p>
        <p>Global Insrance PLC</p>
        <p>Global Insrance PLC</p>
        <p>Global Insrance PLC</p>
    </main>

    <script>
        const commons = document.getElementsByTagName('p');
        const totalNumber = commons.length;
        document.write("Total numbers of paragraph is : ",totalNumber);

        for(const c in commons){
           commons[c].style.color="purple";
           commons[c].style.fontWeight="bold";
        }
    </script>
</body>
</html>
