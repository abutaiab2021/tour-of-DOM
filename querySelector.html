<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Selector</title>
</head>
<body>
    <main>
        <header>
            <h1>This is Our Menu </h1>
            <ul>
                <li class="menu">menu-1</li>
                <li class="menu">menu-2</li>
                <li class="menu">menu-3</li>
                <li class="menu">menu-4</li>
            </ul>
        </header>
    </main>
    <script>
        // for query selector.//query select only one element access korte pare.
        const heading = document.querySelector('header ul');
        console.log(heading);

        // for query selector all. parent to child all class class and tag sob access korte pare.
        const menus = document.querySelectorAll('header ul li');
        // console.log(menus);

        const liElements =  document.querySelectorAll('menu');
        console.log(liElements);
    </script>
</body>
</html>
